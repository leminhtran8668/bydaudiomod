name: Build BYD Audio Mod APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform & build-tools
        run: |
          sdkmanager --install "platforms;android-29" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-29/android.jar" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Verify tools
        run: |
          echo "ANDROID_JAR=$ANDROID_JAR"
          test -f "$ANDROID_JAR"
          aapt2 version
          d8 --help >/dev/null
          apksigner --version || true
          java -version

      - name: Build APK
        run: |
          sed -i "s|^ANDROID_JAR=.*|ANDROID_JAR=\"$ANDROID_JAR\"|" build.sh
          sed -i "s|^AAPT2=.*|AAPT2=\"$BUILD_TOOLS/aapt2\"|" build.sh
          chmod +x build.sh
          export PATH="$BUILD_TOOLS:$PATH"
          ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bydaudiomod-apk
          path: build/bydaudiomod.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          ls -lh build/bydaudiomod.apk
          echo "### BYD Audio Mod APK built successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package:** com.bydaudiomod" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Author:** Lê Minh" >> "$GITHUB_STEP_SUMMARY"
          echo "- **File:** \`build/bydaudiomod.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tải artifact **bydaudiomod-apk** ở phía trên, copy vào USB thư mục \`Third Party Apps 55/\`, cắm vào xe, mật khẩu \`BYD6125F\`." >> "$GITHUB_STEP_SUMMARY"
