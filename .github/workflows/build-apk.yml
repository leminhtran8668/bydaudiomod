name: Build BYD Audio Mod APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài Android SDK platform-tools & build-tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-29" "build-tools;34.0.0"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-29/android.jar" >> $GITHUB_ENV
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_ENV

      - name: Build APK
        run: |
          # Trỏ build.sh tới android.jar và aapt2 vừa cài, không đổi logic build
          sed -i "s|^ANDROID_JAR=.*|ANDROID_JAR=\"$ANDROID_JAR\"|" build.sh
          sed -i "s|^AAPT2=.*|AAPT2=\"$BUILD_TOOLS/aapt2\"|" build.sh
          chmod +x build.sh
          export PATH="$BUILD_TOOLS:$PATH"
          ./build.sh

      - name: Tải file APK lên (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bydaudiomod-apk
          path: build/door-sound.apk
